# 独立子域名（示例：music.3-104-79-75.sslip.io），证书自行用 acme.sh / certbot 申请
server {
    listen 443 ssl;
    server_name music.example.com;
    ssl_certificate     /etc/ssl/qingyin/fullchain.pem;
    ssl_certificate_key /etc/ssl/qingyin/key.pem;

    client_max_body_size 800m;          # 与 MAX_UPLOAD_MB 保持一致
    proxy_request_buffering off;        # 大文件上传直接流给 Node

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # 下载/播放边下边传
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
