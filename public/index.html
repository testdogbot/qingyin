<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>清音</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css?v=2">
</head>
<body>
<div class="ambient" id="amb"></div>

<div id="auth" class="auth hidden">
  <form class="auth-card" id="authForm">
    <div class="auth-mark"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <div class="logo">清<span>音</span></div>
    <p id="authHint">设置一个访问密码</p>
    <input type="password" id="authPw" placeholder="密码" autocomplete="current-password" required minlength="6">
    <button class="btn primary" type="submit" id="authBtn">进入</button>
    <p class="err" id="authErr"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="logo"><i class="logo-mark"></i>清<span>音</span></div>
    <nav>
      <a data-view="discover" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>发现</span></a>
      <a data-view="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>搜索</span></a>
      <a data-view="library"><svg viewBox="0 0 24 24"><path d="M4 4v16M9 4v16"/><path d="m14 4.5 5 15"/></svg><span>曲库</span></a>
      <a data-view="playlists"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M19 15V5l3-1"/><circle cx="17" cy="16" r="2"/></svg><span>歌单</span></a>
      <a data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>设置</span></a>
    </nav>
    <div class="side-foot">正版免费曲库 · 无损优先</div>
  </aside>
  <main id="main" class="main"></main>

  <footer class="player" id="player">
    <div class="np">
      <div class="cover" id="pCover"></div>
      <div class="np-text"><div class="np-title" id="pTitle">还没在播放</div><div class="np-artist" id="pArtist">挑一首喜欢的吧</div></div>
      <button class="icon like" id="pLike" title="喜欢"></button>
    </div>
    <div class="ctrl">
      <div class="btns">
        <button class="icon mode" id="pShuffle" title="随机"></button>
        <button class="icon" id="pPrev" title="上一首"></button>
        <button class="icon play" id="pPlay" title="播放/暂停"></button>
        <button class="icon" id="pNext" title="下一首"></button>
        <button class="icon mode" id="pRepeat" title="循环"></button>
      </div>
      <div class="bar"><span id="pCur">0:00</span><input type="range" class="rng" id="pSeek" min="0" max="1000" value="0"><span id="pDur">0:00</span></div>
    </div>
    <div class="extra">
      <span class="badge" id="pQual" title="点击切换音质">—</span>
      <button class="icon" id="pQueue" title="播放队列"></button>
      <span class="vol"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><input type="range" class="rng" id="pVol" min="0" max="100" value="90" title="音量"></span>
    </div>
  </footer>
  <div class="queue hidden" id="queue"><div class="queue-head"><b>播放队列</b><button class="link" id="qClear">清空</button></div><div id="qList"></div></div>
</div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>
<script src="/app.js?v=2" type="module"></script>
</body>
</html>
